<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Farewell QR Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root { --plum:#4B315B; --rose:#D9789A; --rose-deep:#B4507A; --gold:#D8B77A; --ivory:#FFF9F2; --lav:#E9DDFB; --blush:#F8DCE6; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "DM Sans", system-ui, sans-serif; color: var(--plum); background: linear-gradient(160deg, #EFE5FD, #F6E3EE); min-height: 100vh; padding: 24px 16px 48px; }
    .tools { max-width: 620px; margin: 0 auto 24px; background: rgba(255,255,255,.7); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
    .tools label { font-weight: 700; font-size: .9rem; }
    .tools input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #d9c8e6; font: inherit; }
    .tools .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .tools button { padding: 12px 20px; border-radius: 999px; border: 0; cursor: pointer; font: inherit; font-weight: 700; color: #fff; background: linear-gradient(135deg, #C9608A, var(--rose-deep)); }
    .tools button.alt { background: #fff; color: var(--plum); border: 1px solid #d9c8e6; }
    .tools p { margin: 0; font-size: .85rem; color: #76627F; }

    .card {
      width: 148mm; max-width: 100%; aspect-ratio: 148 / 105; margin: 0 auto; position: relative; overflow: hidden;
      background: radial-gradient(60% 70% at 15% 15%, var(--blush), transparent 70%), radial-gradient(60% 70% at 90% 90%, var(--lav), transparent 70%), var(--ivory);
      border-radius: 14px; box-shadow: 0 30px 60px -30px rgba(75,49,91,.45);
      display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; gap: 6%; padding: 7% 7%;
    }
    .card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(216,183,122,.7); border-radius: 8px; pointer-events: none; }
    .kicker { font-size: clamp(.55rem, 1.6vw, .72rem); letter-spacing: .2em; text-transform: uppercase; color: #A9733E; font-weight: 700; margin: 0; }
    h1 { font-family: "Playfair Display", serif; font-size: clamp(1.1rem, 4.2vw, 1.75rem); line-height: 1.1; margin: 6px 0 8px; }
    h1 span { color: var(--rose-deep); font-style: italic; }
    .msg { font-family: "Caveat", cursive; font-size: clamp(1rem, 3.6vw, 1.45rem); line-height: 1.15; margin: 0; }
    .sign { font-family: "Caveat", cursive; font-size: clamp(.95rem, 3.2vw, 1.3rem); color: var(--rose-deep); margin: 10px 0 0; }
    .qr-box { background: #fff; padding: 8%; border-radius: 12px; box-shadow: 0 6px 16px -6px rgba(75,49,91,.35); text-align: center; }
    #qr { width: 100%; aspect-ratio: 1; }
    #qr img, #qr canvas { width: 100% !important; height: auto !important; }
    .scan { font-size: clamp(.55rem, 1.6vw, .72rem); font-weight: 700; margin: 8px 0 0; letter-spacing: .04em; }
    .hearts { position: absolute; right: 18px; top: 14px; color: var(--rose); font-size: .9rem; letter-spacing: 6px; }

    @media print {
      @page { size: A5 landscape; margin: 0; }
      body { background: none; padding: 0; }
      .tools { display: none; }
      .card { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; aspect-ratio: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="tools">
    <label for="url">Website address for the QR code</label>
    <input id="url" type="url" placeholder="https://your-site-name.netlify.app">
    <div class="row">
      <button type="button" onclick="window.print()">🖨️ Print card</button>
      <button type="button" class="alt" id="dl">⬇️ Download QR as PNG</button>
    </div>
    <p>Tip: the address is read from <b>siteUrl</b> in config.js. Scan the QR with your own phone before printing!</p>
  </div>

  <div class="card">
    <span class="hearts" aria-hidden="true">♥ ✦ ♥</span>
    <div>
      <p class="kicker">Official notice · Friendship Department™</p>
      <h1>Resignation Rejected<span>.exe</span></h1>
      <p class="msg">You can leave the office,<br>but you can't resign from our friendship. ❤️</p>
      <p class="sign" id="sign"></p>
    </div>
    <div class="qr-box">
      <div id="qr" role="img" aria-label="QR code that opens the farewell website"></div>
      <p class="scan">Scan to open your final notice 💌</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var cfg = window.FAREWELL_CONFIG || {};
      var input = document.getElementById('url');
      var box = document.getElementById('qr');
      document.getElementById('sign').textContent = '— ' + (cfg.myName || '');
      input.value = cfg.siteUrl || '';
      function draw() {
        box.innerHTML = '';
        if (!window.QRCode) { box.textContent = 'QR library could not load (are you online?)'; return; }
        new QRCode(box, { text: input.value || 'https://example.com', width: 512, height: 512, colorDark: '#4B315B', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
      }
      input.addEventListener('input', draw);
      document.getElementById('dl').addEventListener('click', function () {
        var c = box.querySelector('canvas'); if (!c) return;
        var a = document.createElement('a'); a.download = 'farewell-qr.png'; a.href = c.toDataURL('image/png'); a.click();
      });
      draw();
    })();
  </script>
</body>
</html>
